# Base PostgreSQL locale pour le développement (le site en ligne utilise une base hébergée).
# Démarrer : npm run db:up   ·   Arrêter : npm run db:down   (les données sont conservées)
services:
  db:
    image: postgres:17-alpine
    container_name: aulia-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: aulia
      POSTGRES_PASSWORD: aulia-local
      POSTGRES_DB: aulia
    ports:
      - "55432:5432"
    volumes:
      - aulia-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aulia -d aulia"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  aulia-db:
